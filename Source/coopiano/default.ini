# Coopiano Voicing Preset (exported from Coopiano JUCE Studio)
# Compatible with peterc/coopiano CLI and Coopiano VST3/AU plugin

[hammer]
stiffness_scale = 0.9
mass_scale = 1.3
felt_width_scale = 1.4
maximum_velocity_mps = 6.0
velocity_exponent = 1.8

[strings]
decay_scale = 1.1
treble_decay_scale = 0.38
partial_loss_scale = 1.0
inharmonicity_scale = 0.85
unison_detune_scale = 0.35
treble_unison_detune = 0.875
fast_decay_scale = 0.95
horizontal_ratio = 0.4
longitudinal_gain = 0.22
bridge_coupling = 1.0

[tone]
fundamental_boost_db = 0.0
lower_overtone_cut_db = 0.0
bridge_curve_scale = 1.0
mid_gain_db = -1.5
mid_frequency_hz = 1200.0
mid_width_octaves = 0.9

[soundboard]
bass_corner_hz = 70.0
treble_corner_hz = 3800.0
treble_slope = 1.8
decay_scale = 1.1
low_mode_density = 1.0
ripple_fraction = 0.25
spread = 0.7
position_depth = 0.5

[resonance]
gain = 0.18
maximum_decay_seconds = 12.0
damper_decay_seconds = 0.18
transition_seconds = 0.04
own_drive = 0.0

[reverb]
mix = 0.3
decay_seconds = 1.1
predelay_ms = 12.0
damping_hz = 5500.0
